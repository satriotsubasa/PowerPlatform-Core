name: Feature request
description: Suggest a new capability or an improvement
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - satriotsubasa
body:
  - type: markdown
    attributes:
      value: Thanks for the idea. A little context on the underlying problem helps a lot.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      options:
        - Schema (tables, columns, forms, views, ribbon)
        - Data (rows, queries, config)
        - Cloud flows
        - Plug-ins / custom APIs
        - PCF / web resources
        - Code Apps
        - Solution ALM / delivery
        - Security roles
        - Document generation
        - Custom connectors
        - Platform administration
        - Orchestrator / safety / other
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have already tried or considered
    validations:
      required: false
